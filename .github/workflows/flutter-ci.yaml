name: Flutter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Fastfile 문법 오류는 양쪽 스토어 배포를 동시에 깨뜨리므로 모든 PR 에서 잡는다.
  # (릴리스 검증과 무관하니 skip-release-check 라벨에 영향받지 않도록 별도 잡으로 둔다)
  fastfile_check:
    name: Fastfile 문법 검사
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - run: ruby -c fastlane/Fastfile

  flutter_test_and_build:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[CI]'))
    steps:
      - uses: actions/checkout@v3

      # Dart 설치 (FVM 사용을 위해 필요)
      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      # FVM 설치
      - name: Install FVM
        run: |
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      # FVM을 통해 Flutter 설치
      - name: Install Flutter via FVM
        run: |
          fvm install
          fvm use --force

      # FVM config에서 Flutter 버전 읽어서 환경변수에 저장 (알림용)
      - name: Read Flutter version from FVM
        run: |
          if [ -f ".fvm/fvm_config.json" ]; then
            FLUTTER_VER=$(cat .fvm/fvm_config.json | grep -o '"flutterSdkVersion": "[^"]*' | cut -d'"' -f4)
            echo "FLUTTER_VERSION=$FLUTTER_VER" >> $GITHUB_ENV
          elif [ -f "fvm_config.json" ]; then
            FLUTTER_VER=$(cat fvm_config.json | grep -o '"flutterSdkVersion": "[^"]*' | cut -d'"' -f4)
            echo "FLUTTER_VERSION=$FLUTTER_VER" >> $GITHUB_ENV
          else
            echo "FLUTTER_VERSION=unknown" >> $GITHUB_ENV
          fi

      # Flutter 버전 확인
      - name: Check Flutter version
        run: fvm flutter --version

      # 의존성 설치
      - name: Install dependencies
        run: fvm flutter pub get

      # .env.* 는 시크릿이라 저장소에 없지만 pubspec 의 assets 에 선언돼 있다.
      # 파일이 없으면 analyze 는 asset_does_not_exist 경고로, test 는 asset
      # bundle 빌드 실패로 죽는다. 테스트는 값을 읽지 않으므로(AppEnvironment 는
      # main() 에서만 로드) 자리채움이면 충분하다. 실제 시크릿은 release-* 워크플로에서만
      # 주입한다 — PR CI 에 넣어봐야 얻는 건 없고 노출면만 늘어난다.
      - name: Prepare env files
        run: |
          for f in .env.development .env.production; do
            echo 'API_BASE_URL=https://example.invalid/' > "$f"
          done

      # 코드 분석
      - name: Analyze project source
        run: fvm flutter analyze --no-fatal-infos

      # 테스트 실행
      - name: Run tests
        run: fvm flutter test

      # Discord 알림
      - name: Discord notification
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "::warning::Discord webhook URL is not set. Skipping notification."
            exit 0
          fi
          
          SERVER_URL="${{ github.server_url }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            EVENT_INFO="PR #${{ github.event.number }}: ${{ github.event.pull_request.title }} (${{ github.event.pull_request.html_url }})"
          else
            EVENT_INFO="커밋: ${{ github.event.head_commit.message }} ($SERVER_URL/${{ github.repository }}/commit/${{ github.sha }})"
          fi
          
          FLUTTER_INFO="Flutter 버전: ${{ env.FLUTTER_VERSION }}"
          
          if [ "${{ job.status }}" = "success" ]; then
            TITLE="✅ CI/CD 파이프라인 성공"
            DESCRIPTION="모든 작업이 성공적으로 완료되었습니다! 🎉\n$FLUTTER_INFO"
          else
            TITLE="❌ CI/CD 파이프라인 실패"
            DESCRIPTION="GitHub Actions 로그를 확인해주세요. 🔍\n$FLUTTER_INFO"
          fi
          
          curl -H "Content-Type: application/json" -X POST -d "{
            \"content\": \"$TITLE\n$DESCRIPTION\n$EVENT_INFO\"
          }" "$DISCORD_WEBHOOK"
name: Temporary - iOS Pod Lock Sync

on:
  workflow_dispatch:
  # A new dispatch-only workflow is not available before it reaches the default branch.
  pull_request:
    branches: [develop]
    paths:
      - .github/workflows/sync-ios-pod-lock.yml
      - ios/Podfile.lock

permissions:
  contents: read

concurrency:
  group: ios-pod-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-lock:
    if: >-
      (github.head_ref || github.ref_name) == 'chore/#352-sync-ios-pod-lock' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: macos-latest
    timeout-minutes: 45
    outputs:
      revision: ${{ steps.evidence.outputs.revision }}
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    env:
      BUNDLE_FROZEN: 'true'
      COCOAPODS_DISABLE_STATS: 'true'
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout revision to regenerate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Require committed locks
        run: |
          test -s Gemfile.lock
          test -s pubspec.lock
          test -s ios/Podfile.lock

      - name: Set up locked Ruby gems
        uses: ruby/setup-ruby@e8944e80fb94b20106697132f8c20c665fab29e9 # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Set up Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1

      - name: Install FVM and project Flutter
        run: |
          dart pub global activate fvm
          export PATH="$HOME/.pub-cache/bin:$PATH"
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
          fvm install

      - name: Resolve committed Flutter dependencies
        run: |
          fvm flutter pub get --enforce-lockfile
          fvm flutter precache --ios
          git diff --exit-code -- pubspec.yaml pubspec.lock Gemfile Gemfile.lock .fvmrc

      - name: Regenerate native lock without updating existing pins
        working-directory: ios
        run: bundle exec pod install

      - name: Verify native plugin links and installed graph
        run: |
          bundle exec ruby <<'RUBY' | tee "$RUNNER_TEMP/pod-plugin-checks.txt"
          require 'json'
          require 'yaml'

          lock = YAML.safe_load(File.read('ios/Podfile.lock'), permitted_classes: [Symbol])
          manifest = YAML.safe_load(File.read('ios/Pods/Manifest.lock'), permitted_classes: [Symbol])
          abort 'Installed pods differ from Podfile.lock' unless manifest == lock

          plugins = JSON.parse(File.read('.flutter-plugins-dependencies'))
            .fetch('plugins').fetch('ios').reject { |plugin| plugin['native_build'] == false }
          required = %w[firebase_analytics firebase_crashlytics flutter_web_auth_2
                        url_launcher_ios firebase_core firebase_messaging]
          missing = required - plugins.map { |plugin| plugin.fetch('name') }
          abort "Missing Flutter iOS plugins: #{missing.join(', ')}" unless missing.empty?

          dependencies = lock.fetch('DEPENDENCIES').map { |entry| entry.split.first }
          plugins.each do |plugin|
            name = plugin.fetch('name')
            abort "Missing direct pod dependency: #{name}" unless dependencies.include?(name)
            source = lock.fetch('EXTERNAL SOURCES').fetch(name)
            path = source[':path'] || source.fetch(:path)
            link = File.join('ios', '.symlinks', 'plugins', name)
            abort "Missing plugin symlink: #{name}" unless File.symlink?(link)
            unless File.realpath(link) == File.realpath(plugin.fetch('path'))
              abort "Incorrect plugin symlink target: #{name}"
            end
            unless File.file?(File.join('ios', path, "#{name}.podspec"))
              abort "Missing native podspec: #{name}"
            end
            abort "Missing pod checksum: #{name}" unless lock.fetch('SPEC CHECKSUMS').key?(name)
            puts "#{name}: dependency, symlink, podspec and checksum verified"
          end
          RUBY

      - name: Collect lock and regeneration evidence
        id: evidence
        run: |
          git diff --exit-code -- pubspec.yaml pubspec.lock Gemfile Gemfile.lock .fvmrc ios/Podfile
          mkdir -p "$RUNNER_TEMP/ios-pod-lock"
          cp ios/Podfile.lock "$RUNNER_TEMP/ios-pod-lock/Podfile.lock"
          cp "$RUNNER_TEMP/pod-plugin-checks.txt" "$RUNNER_TEMP/ios-pod-lock/"
          git diff -- ios/Podfile.lock > "$RUNNER_TEMP/ios-pod-lock/Podfile.lock.diff"
          {
            git rev-parse HEAD
            fvm flutter --version
            ruby --version
            bundle --version
            bundle exec pod --version
          } > "$RUNNER_TEMP/ios-pod-lock/toolchain.txt"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload generated lock for review
        id: artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-pod-lock-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-pod-lock/
          if-no-files-found: error
          retention-days: 7

  verify-clean-install:
    needs: generate-lock
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      BUNDLE_FROZEN: 'true'
      COCOAPODS_DISABLE_STATS: 'true'
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout the exact generation revision on a fresh runner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.generate-lock.outputs.revision }}
          persist-credentials: false

      - name: Download the generated candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.generate-lock.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/ios-pod-lock

      - name: Establish candidate lock as the comparison baseline
        run: |
          test ! -e ios/Pods
          test ! -e ios/.symlinks
          test -s "$RUNNER_TEMP/ios-pod-lock/Podfile.lock"
          cp "$RUNNER_TEMP/ios-pod-lock/Podfile.lock" ios/Podfile.lock
          # Stage only inside this disposable runner; no commit is created.
          git add -- ios/Podfile.lock

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Set up locked Ruby gems
        uses: ruby/setup-ruby@e8944e80fb94b20106697132f8c20c665fab29e9 # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Set up Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1

      - name: Install FVM and project Flutter
        run: |
          dart pub global activate fvm
          export PATH="$HOME/.pub-cache/bin:$PATH"
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
          fvm install

      - name: Resolve committed Flutter dependencies
        run: |
          fvm flutter pub get --enforce-lockfile
          fvm flutter precache --ios
          git diff --exit-code -- pubspec.yaml pubspec.lock Gemfile Gemfile.lock .fvmrc ios/Podfile ios/Podfile.lock

      - name: Install native dependencies in deployment mode
        working-directory: ios
        run: bundle exec pod install --deployment

      - name: Reject lock drift after the clean install
        run: |
          git diff --exit-code -- pubspec.yaml pubspec.lock Gemfile Gemfile.lock .fvmrc ios/Podfile ios/Podfile.lock
          cmp "$RUNNER_TEMP/ios-pod-lock/Podfile.lock" ios/Podfile.lock
          cmp ios/Podfile.lock ios/Pods/Manifest.lock
          echo 'Generated Podfile.lock passed a clean deployment install without changes.' >> "$GITHUB_STEP_SUMMARY"

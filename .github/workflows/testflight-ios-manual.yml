name: Manual - iOS TestFlight

on:
  push:
    branches:
      - 'fix/#251-ios-laundry-push-notification'
  workflow_dispatch:
    inputs:
      changelog:
        description: TestFlight test notes
        required: false
        default: "iOS laundry completion push notification test"

permissions:
  contents: read

concurrency:
  group: manual-ios-testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  upload-testflight:
    name: Build & Upload to TestFlight
    runs-on: macos-latest

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Show selected revision
        run: |
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Set up Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1

      - name: Install FVM
        run: |
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Install Flutter via FVM
        run: |
          fvm install
          fvm use --force

      - name: Set up Ruby
        uses: ruby/setup-ruby@e8944e80fb94b20106697132f8c20c665fab29e9 # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Export CocoaPods bin to PATH
        run: |
          bundle binstubs cocoapods
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      - name: Flutter pub get
        run: fvm flutter pub get

      - name: Flutter precache iOS artifacts
        run: fvm flutter precache --ios

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: bundle exec pod install

      - name: Restore production env
        env:
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
          ENV_DEVELOPMENT: ${{ secrets.ENV_DEVELOPMENT }}
        run: |
          if [ -z "$ENV_PRODUCTION" ] || [ -z "$ENV_DEVELOPMENT" ]; then
            echo "::error::ENV_PRODUCTION or ENV_DEVELOPMENT secret is missing."
            exit 1
          fi
          printf '%s' "$ENV_PRODUCTION" > .env.production
          printf '%s' "$ENV_DEVELOPMENT" > .env.development

      - name: Install Apple certificate and provisioning profile
        env:
          IOS_BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_BUILD_PROVISION_PROFILE_BASE64 }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$IOS_BUILD_CERTIFICATE_BASE64" ] || [ -z "$IOS_P12_PASSWORD" ] || \
             [ -z "$IOS_BUILD_PROVISION_PROFILE_BASE64" ] || [ -z "$IOS_KEYCHAIN_PASSWORD" ]; then
            echo "::error::iOS signing secrets are missing."
            exit 1
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          printf '%s' "$IOS_BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$IOS_BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychain -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -k "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_OUTPUT=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")
          echo "$CERT_OUTPUT"
          if echo "$CERT_OUTPUT" | grep -qE "^[[:space:]]*0 valid identities found"; then
            echo "::error::No valid signing certificate found in keychain."
            exit 1
          fi

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles"

          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)
          if [ -z "$PROFILE_UUID" ]; then
            echo "::error::Failed to extract UUID from provisioning profile."
            exit 1
          fi
          echo "IOS_PROVISIONING_PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Resolve iOS version metadata
        run: |
          VERSION_LINE="$(grep '^version:' pubspec.yaml | head -n 1 | awk '{print $2}')"
          VERSION_NAME="${VERSION_LINE%%+*}"
          BASE_BUILD_NUMBER="${VERSION_LINE#*+}"

          if [ -z "$VERSION_NAME" ] || [ -z "$BASE_BUILD_NUMBER" ] || \
             [ "$BASE_BUILD_NUMBER" = "$VERSION_LINE" ]; then
            echo "::error::Unable to parse version and build number from pubspec.yaml"
            exit 1
          fi

          BUILD_NUMBER="${BASE_BUILD_NUMBER}.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"

          echo "IOS_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "IOS_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Verify upload prerequisites
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          if [ -z "$IOS_PROVISIONING_PROFILE_UUID" ] || [ -z "$IOS_VERSION_NAME" ] || \
             [ -z "$IOS_BUILD_NUMBER" ]; then
            echo "::error::iOS build metadata is missing."
            exit 1
          fi
          if [ -z "$APP_STORE_CONNECT_API_KEY" ] || [ -z "$APP_STORE_CONNECT_KEY_ID" ] || \
             [ -z "$APP_STORE_CONNECT_ISSUER_ID" ]; then
            echo "::error::App Store Connect secrets are missing."
            exit 1
          fi
          echo "Version: $IOS_VERSION_NAME ($IOS_BUILD_NUMBER)"

      - name: Build and upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TESTFLIGHT_CHANGELOG: ${{ inputs.changelog }}
        run: bundle exec fastlane ios upload_testflight

      - name: Clean up signing files
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/build_certificate.p12"
          rm -f "$RUNNER_TEMP/build_pp.mobileprovision"
          rm -f .env.production
          rm -f .env.development
